<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SF6 Matchup Lab — Tier View</title>
  <meta name="description" content="Street Fighter 6 matchup tier list and sub-character finder, built on Capcom Buckler diagram data.">
  <style>
/* SF6 Matchup Lab — v2 "Tier View": bold dark esports tier-list.
   Red↔blue "versus" diverging tier palette, indigo UI accent, condensed display.
   Shares app/scoring/i18n logic with v1; distinct IA (chips grouped into bands). */

:root {
  --bg: #0B0E16;
  --surface: #131826;
  --raised: #1A2132;
  --line: #283047;
  --line-soft: #1F2740;
  --text: #EAEEF7;
  --text-dim: #8A93A8;

  --accent: #6E8BFF;          /* indigo — interactive, NOT in the tier scale */

  /* versus diverging tier scale: hot (bad) → cool (good) */
  --t-dis: #FF4D5E;
  --t-sdis: #FF9D42;
  --t-even: #7C8AA5;
  --t-sadv: #5BD68A;
  --t-adv: #36C2CE;

  --font-display: 'Rajdhani', 'Chakra Petch', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-body: 'Inter', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --space-1: 0.375rem;
  --space-2: 0.75rem;
  --space-3: 1.25rem;
  --space-4: 2rem;
  --radius: 10px;
  --dur: 300ms;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background:
    radial-gradient(900px 420px at 88% -8%, rgba(54, 194, 206, 0.10), transparent 60%),
    radial-gradient(800px 460px at -6% 108%, rgba(255, 77, 94, 0.10), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.92rem; line-height: 1.5;
  min-height: 100vh;
}

/* ---------- topbar ---------- */

.topbar {
  display: flex; justify-content: space-between; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  border-bottom: 1px solid var(--line);
  background: rgba(11, 14, 22, 0.85); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 50;
}

.brand { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }

.brand-mark {
  font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
  color: #0B0E16; background: linear-gradient(135deg, var(--t-adv), var(--accent));
  padding: 0.08rem 0.45rem; border-radius: 5px; letter-spacing: 0.04em;
}

.brand-name {
  font-family: var(--font-display); font-weight: 700; font-size: 1.3rem;
  letter-spacing: 0.06em; text-transform: uppercase;
}

.brand-name em { font-style: normal; color: var(--t-adv); }

.brand-kicker { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.12em; color: var(--text-dim); }

.topbar-right { display: flex; align-items: center; gap: var(--space-2); }

.alt-link {
  font-family: var(--font-display); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em;
  color: var(--text-dim); text-decoration: none;
  padding: 0.3rem 0.6rem; border: 1px solid var(--line); border-radius: 6px;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.alt-link:hover { color: var(--accent); border-color: var(--accent); }

.lang-switch { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lang-switch button {
  font-family: var(--font-display); font-size: 0.74rem; font-weight: 600;
  padding: 0.28rem 0.6rem; background: var(--surface); color: var(--text-dim); border: none; cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.lang-switch button.active { background: var(--accent); color: #0B0E16; }
.lang-switch button:not(.active):hover { color: var(--text); }

.reset-btn {
  font-family: var(--font-display); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.06em;
  padding: 0.32rem 0.7rem; border-radius: 6px;
  background: var(--surface); color: var(--text-dim); border: 1px solid var(--line); cursor: pointer;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.reset-btn:hover { color: var(--t-dis); border-color: var(--t-dis); }

/* ---------- toolbar ---------- */

.toolbar { display: flex; align-items: flex-end; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-3) var(--space-4) 0; }

.control-label {
  display: block; font-family: var(--font-display);
  font-size: 0.62rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 0.3rem;
}
.control-label small { letter-spacing: 0.04em; text-transform: none; opacity: 0.8; }

.view-switch { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.view-switch button {
  font-family: var(--font-display); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;
  padding: 0.4rem 1rem; border: none; border-radius: 6px; background: none; color: var(--text-dim); cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.view-switch button.active { background: var(--accent); color: #0B0E16; }
.view-switch button:not(.active):hover { color: var(--text); }

.char-field select {
  font-family: var(--font-display); font-size: 1rem; font-weight: 600; letter-spacing: 0.02em;
  padding: 0.4rem 0.7rem; min-width: 11rem;
  background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
}

.rank-tabs { display: flex; gap: 4px; }
.rank-tabs button {
  font-family: var(--font-display); font-size: 0.78rem; font-weight: 600;
  padding: 0.42rem 0.7rem; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-dim); cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.rank-tabs button.active { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- board / hero ---------- */

.board { padding: var(--space-3) var(--space-4) var(--space-4); max-width: 1180px; }

.hero {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  flex-wrap: wrap; margin-bottom: var(--space-3);
}

.hero-id { display: flex; align-items: baseline; gap: 0.7rem; }

.view-label {
  font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.16em;
  color: var(--bg); background: var(--text-dim); padding: 0.15rem 0.45rem; border-radius: 5px;
}

.char-name {
  font-family: var(--font-display); font-weight: 700; font-size: 2.2rem;
  letter-spacing: 0.04em; text-transform: uppercase;
  background: linear-gradient(90deg, var(--text), var(--accent));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

.hero-summary { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.hero-summary .sum {
  font-family: var(--font-display); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.04em;
  padding: 0.3rem 0.6rem; border-radius: 6px; border: 1px solid var(--line); background: var(--surface);
}
.hero-summary .sum.dis { color: var(--t-dis); border-color: rgba(255, 77, 94, 0.4); }
.hero-summary .sum.even { color: var(--t-even); }
.hero-summary .sum.adv { color: var(--t-adv); border-color: rgba(54, 194, 206, 0.4); }

/* ---------- controls ---------- */

.controls-card {
  display: grid; grid-template-columns: 1.5fr 1fr auto; gap: var(--space-4); align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--space-3); margin-bottom: var(--space-3);
}
.control-head { display: flex; justify-content: space-between; align-items: baseline; }
.presets { display: flex; gap: 4px; }
.presets button {
  font-family: var(--font-display); font-size: 0.64rem; letter-spacing: 0.04em;
  padding: 0.15rem 0.5rem; border-radius: 5px; background: var(--raised); border: 1px solid var(--line);
  color: var(--text-dim); cursor: pointer;
}
.presets button.active { border-color: var(--accent); color: var(--accent); }

.slider-row { display: grid; grid-template-columns: 4.8rem 1fr 2.2rem; align-items: center; gap: 0.6rem; padding: 0.26rem 0; }
.slider-row .slider-name { font-family: var(--font-display); font-size: 0.76rem; font-weight: 600; color: var(--text); }
.slider-row .slider-val { font-family: var(--font-mono); font-size: 0.74rem; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--line); cursor: pointer; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: none; box-shadow: 0 0 8px rgba(110, 139, 255, 0.6); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: none; }

.check { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; cursor: pointer; }
.check small { color: var(--text-dim); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

#tier-control.disabled #tier-sliders { opacity: 0.4; pointer-events: none; }
.tier-hint { display: none; font-family: var(--font-display); font-size: 0.64rem; letter-spacing: 0.02em; color: var(--accent); margin-top: var(--space-1); }
#tier-control.disabled .tier-hint { display: block; }

/* per-opponent weight steppers */
.exclude-chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 13rem; overflow-y: auto; }
.exclude-hint { display: block; font-family: var(--font-display); font-size: 0.6rem; letter-spacing: 0.02em; color: var(--text-dim); margin-top: var(--space-1); line-height: 1.4; }
.opp-w { display: inline-flex; align-items: center; gap: 0.2rem; background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 0.1rem 0.2rem; }
.opp-w .opp-name { font-family: var(--font-display); font-size: 0.68rem; font-weight: 600; color: var(--text); min-width: 3.4rem; }
.opp-w .opp-val { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; color: var(--text-dim); min-width: 0.8rem; text-align: center; }
.opp-step { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1; width: 1.1rem; height: 1.1rem; padding: 0; background: var(--surface); color: var(--text-dim); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
.opp-step:hover { color: var(--text); border-color: var(--accent); }
.opp-w.excluded { opacity: 0.5; }
.opp-w.excluded .opp-name { text-decoration: line-through; }
.opp-w.excluded .opp-val { color: var(--t-dis); }
.opp-w.targeted { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opp-w.targeted .opp-val { color: var(--accent); }

/* ---------- caption ---------- */

.caption { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.01em; color: var(--text-dim); margin-bottom: var(--space-2); }
.caption b { color: var(--text); font-weight: 600; }

/* ---------- tier lanes ---------- */

.lanes { display: flex; flex-direction: column; gap: var(--space-2); }

.lane {
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--tier-color, var(--line));
  border-radius: 8px; padding: var(--space-2) var(--space-3);
}
.lane.t-dis { --tier-color: var(--t-dis); }
.lane.t-sdis { --tier-color: var(--t-sdis); }
.lane.t-even { --tier-color: var(--t-even); }
.lane.t-sadv { --tier-color: var(--t-sadv); }
.lane.t-adv { --tier-color: var(--t-adv); }

.lane-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: var(--space-2); }
.lane-name {
  font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--tier-color);
}
.lane-count {
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim);
  background: var(--raised); border-radius: 20px; padding: 0.05rem 0.5rem; min-width: 1.6rem; text-align: center;
}
.lane-empty { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim); opacity: 0.6; padding: 0.2rem 0; }

.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }

.chip {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-family: var(--font-body); font-size: 0.82rem;
  padding: 0.4rem 0.7rem; border-radius: 7px; cursor: pointer;
  background: var(--raised);
  border: 1px solid var(--line);
  border-left: 3px solid var(--chip-color, var(--tier-color, var(--line)));
  color: var(--text); transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.chip.t-dis { --chip-color: var(--t-dis); }
.chip.t-sdis { --chip-color: var(--t-sdis); }
.chip.t-even { --chip-color: var(--t-even); }
.chip.t-sadv { --chip-color: var(--t-sadv); }
.chip.t-adv { --chip-color: var(--t-adv); }

.chip:hover { transform: translateY(-2px); background: #20283c; border-color: var(--chip-color, var(--accent)); }

.chip-name { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.02em; }
.chip-score { font-family: var(--font-mono); font-weight: 700; font-size: 0.82rem; color: var(--chip-color, var(--text)); font-variant-numeric: tabular-nums; }
.chip-trend { font-family: var(--font-mono); font-size: 0.78rem; }
.chip-trend.up { color: var(--t-adv); }
.chip-trend.dn { color: var(--t-dis); }
.chip-flag { color: var(--t-sdis); font-size: 0.78rem; }
.chip-corr { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); }
.chip-corr.good { color: var(--t-adv); }
.chip-corr.bad { color: var(--t-dis); }

.loading { color: var(--text-dim); font-family: var(--font-display); letter-spacing: 0.06em; }

/* ---------- focus / responsive / motion ---------- */

select:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (max-width: 880px) {
  .controls-card { grid-template-columns: 1fr; gap: var(--space-3); }
  .topbar, .toolbar, .board { padding-left: var(--space-3); padding-right: var(--space-3); }
  .char-name { font-size: 1.7rem; }
}

@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }

</style>
</head>

    <div class="caption" id="caption"></div>
    <div class="lanes" id="lanes" aria-live="polite"></div>

/* Localized character display name; falls back to the canonical name. */

  return lang === 'zh' ? CHAR_ZH[name] ?? name : name;
}

function t(key, vars) {

  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace(`{${k}}`, v);

<script>
/* Port of scripts/scoring.py + analyze.py/recommend.py aggregation.
   UI-free so node can require() it — tests/test_js_parity.py asserts these
   functions match the Python originals. Keep formulas in sync with METHOD.md. */

const PATCH_MONTH = '202603'; // major all-character balance patch, 2026-03-17
const DEFAULT_TIER_WEIGHTS = { 40: 1, 41: 2, 42: 3 };
const RANK_NAMES = { 40: 'HighM', 41: 'GrandM', 42: 'UltM' };

function monthWeights(months, profile, patchMonth) {
  if (profile === 'all') return Object.fromEntries(months.map(m => [m, 1.0]));
  // 'current': pre-patch 0, patch month 0.5, post-patch 1; fallback to equal
  const w = Object.fromEntries(months.map(m =>
    [m, m < patchMonth ? 0.0 : m === patchMonth ? 0.5 : 1.0]));
  return Object.values(w).some(v => v) ? w
    : Object.fromEntries(months.map(m => [m, 1.0]));
}

function wavg(scores, weights) {
  let num = 0, den = 0;
  for (const k of Object.keys(scores)) {
    const w = weights[k];
    if (w) { num += scores[k] * w; den += w; }
  }
  return den ? num / den : null;
}

function coverage(mainRow, subRow, oppWeights) {
  // w(O) = u(O)·sev(O) + max(0, u(O)−1)·inject,  sev = max(0, 5−main)²,
  // inject = max(maxSev, 0.02). u defaults to 1 (→ plain weakness-weighted score),
  // u=0 drops O, u>1 targets it. Missing subRow entries count as neutral (5.0).
  const sev = {};
  let maxSev = 0;
  for (const [o, ms] of Object.entries(mainRow)) {
    const v = Math.max(0, 5.0 - ms) ** 2;
    sev[o] = v;
    if (v > maxSev) maxSev = v;
  }
  const inject = Math.max(maxSev, 0.02);
  let num = 0, den = 0;
  for (const [opp, s] of Object.entries(sev)) {
    const u = oppWeights ? (oppWeights[opp] ?? 1) : 1;
    const w = u * s + Math.max(0, u - 1) * inject;
    if (w) {
      num += w * ((subRow[opp] ?? 5.0) - 5.0);
      den += w;
    }
  }
  return den ? num / den : 0.0;
}

function correlation(a, b) {
  const keys = Object.keys(a).filter(k => k in b).sort();
  if (!keys.length) return 0.0;
  const xs = keys.map(k => a[k]), ys = keys.map(k => b[k]);
  const mx = xs.reduce((s, v) => s + v, 0) / xs.length;
  const my = ys.reduce((s, v) => s + v, 0) / ys.length;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < keys.length; i++) {
    sxy += (xs[i] - mx) * (ys[i] - my);
    sxx += (xs[i] - mx) ** 2;
    syy += (ys[i] - my) ** 2;
  }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : 0.0;
}

function sharedWeaknesses(a, b, thresh = 4.9) {
  return Object.keys(a).filter(k => k in b && a[k] < thresh && b[k] < thresh).sort();
}

/* CSV rows -> idx[char][opp][rank][month] = score */
function buildIndex(csvText) {
  const idx = {};
  const lines = csvText.trim().split('\n');
  for (let i = 1; i < lines.length; i++) {
    const [month, rank, char, opp, score] = lines[i].split(',');
    (((idx[char] ??= {})[opp] ??= {})[rank] ??= {})[month] = parseFloat(score);
  }
  return idx;
}

function availableMonths(csvText) {
  const months = new Set();
  const lines = csvText.trim().split('\n');
  for (let i = 1; i < lines.length; i++) months.add(lines[i].split(',', 1)[0]);
  return [...months].sort();
}

/* {opp: tier-combined score} — mirrors analyze.combined_row */
function combinedRow(idx, char, mw, exclude, tierWeights, ranks = null) {
  ranks ??= Object.keys(tierWeights);
  const out = {};
  for (const [opp, byrank] of Object.entries(idx[char] ?? {})) {
    if (exclude.has(opp)) continue;
    let num = 0, den = 0;
    for (const r of ranks) {
      const v = wavg(byrank[r] ?? {}, mw);
      if (v !== null) { num += v * tierWeights[r]; den += tierWeights[r]; }
    }
    if (den) out[opp] = num / den;
  }
  return out;
}

/* mirrors analyze.char_table; rows sorted by comb ascending */
function charTable(idx, char, mw, exclude, tierWeights, patchMonth) {
  const rows = [];
  for (const [opp, byrank] of Object.entries(idx[char] ?? {})) {
    if (exclude.has(opp)) continue;
    const tier = {};
    let num = 0, den = 0;
    for (const r of Object.keys(tierWeights)) {
      tier[r] = wavg(byrank[r] ?? {}, mw);
      if (tier[r] !== null) { num += tier[r] * tierWeights[r]; den += tierWeights[r]; }
    }
    if (!den) continue;
    const present = Object.values(tier).filter(v => v !== null);
    const g = byrank['41'] ?? {};
    const pre = [], post = [];
    for (const [m, v] of Object.entries(g)) {
      if (!mw[m] && mw[m] !== 0) continue; // month outside requested range
      if (m < patchMonth) pre.push(v); else if (m > patchMonth) post.push(v);
    }
    const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
    const monthsSeen = new Set();
    for (const r of Object.values(byrank))
      for (const m of Object.keys(r)) if (m in mw) monthsSeen.add(m);
    rows.push({
      opp,
      t40: tier['40'], t41: tier['41'], t42: tier['42'],
      comb: num / den,
      spread: Math.max(...present) - Math.min(...present),
      dpatch: pre.length && post.length ? mean(post) - mean(pre) : null,
      nmonths: monthsSeen.size,
    });
  }
  rows.sort((a, b) => a.comb - b.comb);
  return rows;
}

/* mirrors recommend.py main loop; rows sorted by cover descending */
function subTable(idx, char, mw, exclude, tierWeights, oppWeights) {
  const mainRow = combinedRow(idx, char, mw, exclude, tierWeights);
  const worst3 = Object.keys(mainRow).sort((a, b) => mainRow[a] - mainRow[b]).slice(0, 3);
  const results = [];
  for (const sub of Object.keys(idx)) {
    if (sub === char || exclude.has(sub)) continue;
    const row = combinedRow(idx, sub, mw, exclude, tierWeights);
    if (!Object.keys(row).length) continue;
    const perTier = {};
    for (const r of Object.keys(tierWeights))
      perTier[r] = coverage(mainRow, combinedRow(idx, sub, mw, exclude, tierWeights, [r]), oppWeights);
    const w3 = worst3.filter(o => o in row).map(o => row[o]);
    results.push({
      sub,
      cover: coverage(mainRow, row, oppWeights),
      c40: perTier['40'], c41: perTier['41'], c42: perTier['42'],
      w3win: w3.length ? w3.reduce((s, v) => s + v, 0) / w3.length * 10 : null,
      corr: correlation(mainRow, row),
      shared: sharedWeaknesses(mainRow, row).length,
    });
  }
  results.sort((a, b) => b.cover - a.cover);
  return { worst3, mainRow, results };
}

if (typeof module !== 'undefined') {
  module.exports = {
    PATCH_MONTH, DEFAULT_TIER_WEIGHTS, RANK_NAMES,
    monthWeights, wavg, coverage, correlation, sharedWeaknesses,
    buildIndex, availableMonths, combinedRow, charTable, subTable,
  };
}

</script>
<script>
/* v2 tier-list renderer. Reuses scoring.js (math) + i18n.js (strings/names/roster);
   only the presentation differs from v1 (chips grouped into matchup bands). */

const state = {
  view: 'match',
  char: 'TERRY',
  rank: 'comb',
  preset: 'current',
  monthW: {},
  tierW: { 40: 1, 41: 2, 42: 3 },
  oppW: { INGRID: 0 },    // per-opponent weight (sparse; absent = 1). 0 = exclude, >1 = target
};

let idx = null;
let months = [];

const $ = sel => document.querySelector(sel);
const DEFAULT_TIER = { 40: 1, 41: 2, 42: 3 };

// official Buckler bands, rendered worst-first (top to bottom)
const MATCH_TIERS = [
  { lo: -Infinity, hi: 4.7, label: 'tierDis', cls: 't-dis' },
  { lo: 4.7, hi: 4.9, label: 'tierSlightDis', cls: 't-sdis' },
  { lo: 4.9, hi: 5.1, label: 'tierEven', cls: 't-even' },
  { lo: 5.1, hi: 5.3, label: 'tierSlightAdv', cls: 't-sadv' },
  { lo: 5.3, hi: Infinity, label: 'tierAdv', cls: 't-adv' },
];

// sub-coverage bands (best cover first)
const SUB_TIERS = [
  { lo: 0.15, hi: Infinity, label: 'subStrong', cls: 't-adv' },
  { lo: 0.0, hi: 0.15, label: 'subModerate', cls: 't-sadv' },
  { lo: -Infinity, hi: 0.0, label: 'subShares', cls: 't-dis' },
];

const fmt = (v, nd = 3) => v === null || v === undefined ? '—' : v.toFixed(nd);
const sfmt = (v, nd = 3) => v === null || v === undefined ? '—'
  : (v >= 0 ? '+' : '') + v.toFixed(nd);

init();

async function init() {
  setLang(lang);
  applyI18n();
  let csv;
  if (typeof MATRIX_CSV !== 'undefined') {
    csv = MATRIX_CSV;
  } else {
    const resp = await fetch('../output/matrix.csv');
    if (!resp.ok) { $('#loading').textContent = t('loadError'); return; }
    csv = await resp.text();
  }
  idx = buildIndex(csv);
  months = availableMonths(csv);
  state.monthW = monthWeights(months, 'current', PATCH_MONTH);
  $('#loading').remove();
  buildCharSelect();
  buildMonthSliders();
  buildTierSliders();
  buildOppWeights();
  wireControls();
  render();
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-rank]').forEach(el => el.textContent = t('rank')[el.dataset.i18nRank]);
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  $('#view-label').textContent = t(state.view === 'match' ? 'labelMatch' : 'labelSubs');
  $('#char-name').textContent = cn(state.char);
  document.querySelectorAll('#char-select option').forEach(o => o.textContent = cn(o.value));
  document.querySelectorAll('#exclude-chips .opp-w').forEach(el =>
    el.querySelector('.opp-name').textContent = cn(el.dataset.char));
}

function exclude() { return new Set(Object.keys(state.oppW).filter(c => state.oppW[c] === 0)); }

/* ---------- controls (shared shape with v1) ---------- */

function buildCharSelect() {
  const sel = $('#char-select');
  const present = new Set(Object.keys(idx));
  const ordered = ROSTER_ORDER.filter(c => present.has(c));
  for (const c of [...ordered, ...[...present].filter(c => !ordered.includes(c))]) {
    const o = document.createElement('option');
    o.value = c;
    o.textContent = cn(c);
    sel.appendChild(o);
  }
  sel.value = state.char;
}

// per-opponent weight steppers: 0 = exclude, 1 = normal, 2-3 = target
function buildOppWeights() {
  const box = $('#exclude-chips');
  box.textContent = '';
  const present = new Set(Object.keys(idx));
  const ordered = ROSTER_ORDER.filter(c => present.has(c));
  for (const c of [...ordered, ...[...present].filter(c => !ordered.includes(c))]) {
    const el = document.createElement('div');
    el.className = 'opp-w';
    el.dataset.char = c;
    el.innerHTML = `<button class="opp-step" data-d="-1" aria-label="decrease">−</button>
      <span class="opp-name">${cn(c)}</span>
      <span class="opp-val"></span>
      <button class="opp-step" data-d="1" aria-label="increase">+</button>`;
    const valEl = el.querySelector('.opp-val');
    const paint = () => {
      const w = state.oppW[c] ?? 1;
      valEl.textContent = w;
      el.classList.toggle('excluded', w === 0);
      el.classList.toggle('targeted', w > 1);
    };
    el.querySelectorAll('.opp-step').forEach(btn =>
      btn.addEventListener('click', () => {
        const w = Math.max(0, Math.min(3, (state.oppW[c] ?? 1) + Number(btn.dataset.d)));
        if (w === 1) delete state.oppW[c]; else state.oppW[c] = w;
        paint();
        render();
      }));
    paint();
    box.appendChild(el);
  }
}

function sliderRow(name, value, max, step, onInput) {
  const row = document.createElement('div');
  row.className = 'slider-row';
  row.innerHTML = `<span class="slider-name">${name}</span>
    <input type="range" min="0" max="${max}" step="${step}" value="${value}" aria-label="${name} weight">
    <span class="slider-val">${value}</span>`;
  const input = row.querySelector('input');
  const val = row.querySelector('.slider-val');
  input.addEventListener('input', () => { val.textContent = input.value; onInput(parseFloat(input.value)); });
  return row;
}

function buildMonthSliders() {
  const box = $('#month-sliders');
  box.textContent = '';
  for (const m of months) {
    box.appendChild(sliderRow(`${m.slice(0, 4)}.${m.slice(4)}`, state.monthW[m], 1, 0.05, v => {
      state.monthW[m] = v; setPreset('custom'); render();
    }));
  }
}

function buildTierSliders() {
  const box = $('#tier-sliders');
  box.textContent = '';
  for (const r of ['40', '41', '42']) {
    box.appendChild(sliderRow(t('rankFull')[r], state.tierW[r], 5, 0.5, v => { state.tierW[r] = v; render(); }));
  }
}

function updateTierState() {
  const active = state.rank === 'comb';
  const sec = $('#tier-control');
  sec.classList.toggle('disabled', !active);
  sec.querySelectorAll('input').forEach(i => { i.disabled = !active; });
}

function setPreset(p) {
  state.preset = p;
  document.querySelectorAll('.presets button').forEach(b => b.classList.toggle('active', b.dataset.preset === p));
}

function resetDefaults() {
  state.rank = 'comb';
  state.tierW = { ...DEFAULT_TIER };
  state.oppW = { INGRID: 0 };
  setPreset('current');
  state.monthW = monthWeights(months, 'current', PATCH_MONTH);
  document.querySelectorAll('.rank-tabs button').forEach(x => {
    const on = x.dataset.rank === 'comb';
    x.classList.toggle('active', on); x.setAttribute('aria-selected', on);
  });
  buildMonthSliders();
  buildTierSliders();
  buildOppWeights();
  render();
}

function selectChar(c) {
  state.char = c;
  $('#char-select').value = c;
  $('#char-name').textContent = cn(c);
  render();
}

function wireControls() {
  document.querySelectorAll('.view-switch button').forEach(b =>
    b.addEventListener('click', () => {
      state.view = b.dataset.view;
      document.querySelectorAll('.view-switch button').forEach(x => {
        x.classList.toggle('active', x === b); x.setAttribute('aria-selected', x === b);
      });
      $('#view-label').textContent = t(state.view === 'match' ? 'labelMatch' : 'labelSubs');
      render();
    }));

  document.querySelectorAll('.lang-switch button').forEach(b =>
    b.addEventListener('click', () => {
      if (b.dataset.lang === lang) return;
      setLang(b.dataset.lang); applyI18n(); buildTierSliders(); render();
    }));

  $('#char-select').addEventListener('change', e => selectChar(e.target.value));

  document.querySelectorAll('.rank-tabs button').forEach(b =>
    b.addEventListener('click', () => {
      state.rank = b.dataset.rank;
      document.querySelectorAll('.rank-tabs button').forEach(x => {
        x.classList.toggle('active', x === b); x.setAttribute('aria-selected', x === b);
      });
      render();
    }));

  document.querySelectorAll('.presets button').forEach(b =>
    b.addEventListener('click', () => {
      setPreset(b.dataset.preset);
      state.monthW = monthWeights(months, b.dataset.preset, PATCH_MONTH);
      buildMonthSliders(); render();
    }));

  $('#reset-btn').addEventListener('click', resetDefaults);
}

/* ---------- tier rendering ---------- */

function render() {
  updateTierState();
  if (state.view === 'match') renderMatch(); else renderSubs();
}

function laneHtml(tier, chips) {
  const count = chips.length;
  const body = count
    ? `<div class="chips">${chips.join('')}</div>`
    : `<div class="lane-empty">${t('tierEmpty')}</div>`;
  return `<section class="lane ${tier.cls}">
    <div class="lane-head"><span class="lane-name">${t(tier.label)}</span><span class="lane-count">${count}</span></div>
    ${body}
  </section>`;
}

function matchChip(r, metric) {
  const v = metric(r);
  const tierCls = MATCH_TIERS.find(tr => v >= tr.lo && v < tr.hi).cls;
  const trend = r.dpatch === null ? ''
    : r.dpatch <= -0.1 ? '<span class="chip-trend dn">↓</span>'
    : r.dpatch >= 0.1 ? '<span class="chip-trend up">↑</span>' : '';
  const flag = r.spread > 0.25 ? `<span class="chip-flag" title="${t('spreadFlag')}">⚠</span>` : '';
  const title = `High ${fmt(r.t40)} · Grand ${fmt(r.t41)} · Ult ${fmt(r.t42)} · Δ ${sfmt(r.dpatch)} · ${t('chipHint')}`;
  return `<button class="chip ${tierCls}" data-char="${r.opp}" title="${title}">
    <span class="chip-name">${cn(r.opp)}</span>
    <span class="chip-score">${fmt(v, 2)}</span>${trend}${flag}
  </button>`;
}

function renderMatch() {
  const table = charTable(idx, state.char, state.monthW, exclude(), state.tierW, PATCH_MONTH);
  const metric = r => state.rank === 'comb' ? r.comb : r['t' + state.rank];
  const rows = table.filter(r => metric(r) !== null);

  const dis = rows.filter(r => metric(r) < 4.9).length;
  const even = rows.filter(r => metric(r) >= 4.9 && metric(r) <= 5.1).length;
  const adv = rows.filter(r => metric(r) > 5.1).length;
  $('#hero-summary').innerHTML =
    `<span class="sum dis">${dis} ${t('tierDis')}</span>` +
    `<span class="sum even">${even} ${t('tierEven')}</span>` +
    `<span class="sum adv">${adv} ${t('tierAdv')}</span>`;

  $('#caption').innerHTML = t('headMatch', {
    char: cn(state.char), n: rows.length,
    metric: state.rank === 'comb' ? t('metricComb') : t('rankFull')[state.rank],
  });

  $('#lanes').innerHTML = MATCH_TIERS.map(tier => {
    const inTier = rows.filter(r => metric(r) >= tier.lo && metric(r) < tier.hi)
                       .sort((a, b) => metric(a) - metric(b));
    return laneHtml(tier, inTier.map(r => matchChip(r, metric)));
  }).join('');

  wireChips();
}

function subChip(r, metric) {
  const v = metric(r);
  const corrCls = r.corr <= -0.1 ? 'good' : r.corr >= 0.1 ? 'bad' : '';
  const title = `w3 ${fmt(r.w3win, 1)}% · corr ${sfmt(r.corr, 2)} · shared ${r.shared} · ${t('chipHint')}`;
  return `<button class="chip" data-char="${r.sub}" title="${title}">
    <span class="chip-name">${cn(r.sub)}</span>
    <span class="chip-score">${sfmt(v, 2)}</span>
    <span class="chip-corr ${corrCls}">r${sfmt(r.corr, 2)}</span>
  </button>`;
}

function renderSubs() {
  const { worst3, mainRow, results } = subTable(idx, state.char, state.monthW, exclude(), state.tierW, state.oppW);
  const metric = r => state.rank === 'comb' ? r.cover : r['c' + state.rank];

  const top = results.slice().sort((a, b) => metric(b) - metric(a))[0];
  const compl = results.slice().sort((a, b) => a.corr - b.corr)[0];
  $('#hero-summary').innerHTML = top ?
    `<span class="sum adv">${t('kTopSub')}: ${cn(top.sub)} ${sfmt(metric(top))}</span>` +
    `<span class="sum even">${t('kComplement')}: ${cn(compl.sub)} r${sfmt(compl.corr, 2)}</span>` : '';

  $('#caption').innerHTML = t('headSubs', {
    char: cn(state.char),
    worst3: worst3.map(o => `<b>${cn(o)}</b> ${mainRow[o].toFixed(3)}`).join(' · '),
    metric: `${t('hCover')}${state.rank === 'comb' ? '' : '@' + t('rankFull')[state.rank]}`,
  });

  $('#lanes').innerHTML = SUB_TIERS.map(tier => {
    const inTier = results.filter(r => metric(r) >= tier.lo && metric(r) < tier.hi)
                          .sort((a, b) => metric(b) - metric(a));
    return laneHtml(tier, inTier.map(r => subChip(r, metric)));
  }).join('');

  wireChips();
}

function wireChips() {
  document.querySelectorAll('.chip[data-char]').forEach(chip =>
    chip.addEventListener('click', () => {
      const c = chip.dataset.char;
      if (idx[c]) selectChar(c);   // drill into that character's matchups
    }));
}

</script>
</body>
</html>
